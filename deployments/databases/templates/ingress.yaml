apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: databasement
  annotations:
    tailscale.com/proxy-group: tailscale-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: databases-databasement
      port:
        name: http
  tls:
    - hosts: ["databasement"]
