# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.6.2/charts/library/common/values.schema.json

controllers:
  main:
    enabled: true
    type: deployment
    initContainers:
      init-chown-data:
        enabled: true
        image:
          repository: busybox
          tag: latest
        command:
          ["sh", "-c", "chown -R 1000:1000 /var/lib/gemserver"]
    containers:
      main:
        enabled: true
        image:
          repository: registry.home.klaus-meyer.net/home/gemserver
          tag: latest

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 80
        protocol: HTTP
        targetPort: 9292

persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10G
    globalMounts:
      - path: /var/lib/gemserver

ingress:
  main:
    className: tailscale
    annotations:
      tailscale.com/proxy-group: tailscale-proxies
    defaultBackend:
      service:
        name: gemserver
        port:
          name: http
    tls:
      - hosts: ["gemserver"]
