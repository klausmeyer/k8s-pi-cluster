# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.1/charts/library/common/values.schema.json

controllers:
  main:
    strategy: RollingUpdate
    initContainers:
      fix-data-permissions:
        image:
          repository: alpine
          tag: latest
        command:
          - /bin/sh
          - -c
          - |
            echo "Fixing user permissions in /data..."
            chown -R 1001:1001 /data
            echo "Done."
    containers:
      main:
        image:
          repository: ghcr.io/tailscale/tsidp
          tag: v0.0.15
        envFrom:
          - configMapRef:
              name: "{{ .Release.Name }}"
          - secretRef:
              name: "{{ .Release.Name }}"

service:
  main:
    controller: main
    annotations:
      tailscale.com/tailnet-fqdn: tsidp.rooster-piranha.ts.net
      tailscale.com/proxy-group: tailscale-egress-proxies
    type: ExternalName
    externalName: placeholder # The operator overwrites the externalName field
    ports:
      https:
        port: 443

configMaps:
  main:
    data:
      TAILSCALE_USE_WIP_CODE: "1"
      TS_STATE_DIR: "/data"
      TS_HOSTNAME: "tsidp" # Change to idp later when dropping Keycloak
      TSIDP_ENABLE_STS: "1"

rawResources:
  release-tracker:
    manifest:
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        annotations:
          sealedsecrets.bitnami.com/namespace-wide: "true"
      spec:
        encryptedData:
          TS_AUTHKEY: 

persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1G
    globalMounts:
      - path: /data
