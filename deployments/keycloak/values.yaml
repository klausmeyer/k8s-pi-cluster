keycloakx:
  fullnameOverride: "keycloak"
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  lifecycleHooks: |
    preStop:
      exec:
        command:
          - sh
          - -c
          - sleep 15
  image:
    tag: "26.7.2" # renovate: image=quay.io/keycloak/keycloak
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--hostname-strict=false"
    - "--features=docker"
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password
          key: password
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
  extraVolumes: |
    - name: theme
      emptyDir: {}
  extraVolumeMounts: |
    - name: theme
      mountPath: /opt/keycloak/themes/keywind
  extraInitContainers: |
    - name: theme-provider
      image: registry.home.klaus-meyer.net/home/keycloak-themes:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
      args:
        - -c
        - |
          echo "Copying theme..."
          cp -R /themes/keywind/* /theme
      volumeMounts:
        - name: theme
          mountPath: /theme
  proxy:
    mode: xforwarded
    http:
      enabled: true
  database:
    vendor: postgres
    hostname: postgres-rw.databases.svc.cluster.local
    port: 5432
    database: keycloak
    username: keycloak
    existingSecret: keycloak-database
