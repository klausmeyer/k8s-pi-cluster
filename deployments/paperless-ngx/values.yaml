paperless-ngx:
  controller:
    type: statefulset
  image:
    tag: "3.1.3" # renovate: image=ghcr.io/paperless-ngx/paperless-ngx
  env:
    PAPERLESS_SECRET_KEY:
      secretKeyRef:
        name: paperless
        key: secret_key
    PAPERLESS_DBENGINE: postgresql
    PAPERLESS_DBHOST: postgres-rw.databases.svc.cluster.local
    PAPERLESS_DBNAME: paperless
    PAPERLESS_DBUSER: paperless
    PAPERLESS_DBPASS:
      secretKeyRef:
        name: paperless-postgresql
        key: password
    PAPERLESS_REDIS: redis://paperless-ngx-redis
    PAPERLESS_URL: https://paperless.rooster-piranha.ts.net
  redis:
    enabled: false
  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
    media:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
    export:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
    consume:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
redis:
  haMode:
    enabled: false
