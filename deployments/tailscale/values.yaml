# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.1/charts/library/common/values.schema.json

rawResources:
  operator-oauth:
    forceRename: operator-oauth
    manifest:
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        annotations:
          sealedsecrets.bitnami.com/namespace-wide: "true"
      spec:
        encryptedData:
          client_id: 
          client_secret: 
  tailscale-proxies:
    forceRename: tailscale-proxies
    manifest:
      apiVersion: tailscale.com/v1alpha1
      kind: ProxyGroup
      metadata:
        name: tailscale-proxies
      spec:
        type: ingress
        replicas: 3
