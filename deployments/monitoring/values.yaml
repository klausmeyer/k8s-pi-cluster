prometheus:
  alertmanager:
    enabled: false

  kube-state-metrics:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  prometheus-pushgateway:
    enabled: false

  server:
    enabled: true
    extraFlags:
      - web.enable-lifecycle
      - web.enable-admin-api
    ingress:
      enabled: false
    persistentVolume:
      enabled: true
      size: 10Gi

  extraScrapeConfigs: |
    - job_name: pi-standalone
      static_configs:
        - targets:
            - km-pi4b-5.fritz.box:9100

    - job_name: pi-k8s-cluster
      static_configs:
        - targets:
            - km-pi4b-1.fritz.box:9100
            - km-pi4b-2.fritz.box:9100
            - km-pi4b-3.fritz.box:9100
            - km-pi4b-4.fritz.box:9100

    - job_name: kube-state-metrics
      static_configs:
        - targets:
            - monitoring-kube-state-metrics.monitoring.svc.cluster.local:8080

    - job_name: speedtest-exporter
      scrape_interval: 1h
      scrape_timeout: 1m
      static_configs:
        - targets:
            - 192.168.178.3:9798

grafana:
  image:
    tag: "13.2.1" # renovate: image=grafana/grafana

  grafana.ini:
    server:
      root_url: https://grafana.rooster-piranha.ts.net
    auth:
      disable_login_form: true
    auth.generic_oauth:
      enabled: true
      name: Tailscale
      allow_sign_up: true
      client_id: $__file{/etc/secrets/oauth/client_id}
      client_secret: $__file{/etc/secrets/oauth/client_secret}
      scopes: openid email profile
      email_attribute_path: email
      login_attribute_path: username
      name_attribute_path: full_name
      auth_url: https://tsidp.rooster-piranha.ts.net/authorize
      token_url: https://tsidp.rooster-piranha.ts.net/token
      api_url: https://tsidp.rooster-piranha.ts.net/userinfo
      role_attribute_path: contains(roles[*], 'admin') && 'GrafanaAdmin' || 'None'
    database:
      type: postgres
      host: postgres-rw.databases.svc.cluster.local
      name: grafana
      user: grafana
      password: $__file{/etc/secrets/database/password}

  extraSecretMounts:
    - name: grafana-database-secret-mount
      secretName: grafana-database
      defaultMode: 0440
      mountPath: /etc/secrets/database
      readOnly: true
    - name: grafana-oauth-secret-mount
      secretName: grafana-oauth
      defaultMode: 0440
      mountPath: /etc/secrets/oauth
      readOnly: true

  ingress:
    enabled: true
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: tailscale-proxies
    hosts: []
    tls:
    - hosts: ["grafana"]
