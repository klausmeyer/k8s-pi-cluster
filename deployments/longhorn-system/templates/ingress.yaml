apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  annotations:
    tailscale.com/proxy-group: tailscale-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: longhorn-frontend
      port:
        name: http
  tls:
    - hosts: ["longhorn"]
